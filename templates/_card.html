<article class="card"><div class="photo"><a href="{{url_for('product',pid=p.id)}}"><img src="{{p.image}}" alt="{{p.name}}"></a><button class="heart {% if p.id in wishlist_ids %}liked{% endif %}" data-wish="{{p.id}}" aria-label="Sevimliga saqlash">♥</button><span class="new-badge">YANGI</span></div><div class="cardbody"><small>{{p.category}}</small><h3><a href="{{url_for('product',pid=p.id)}}">{{p.name}}</a></h3><p>{{p.description[:82]}}{% if p.description|length>82 %}…{% endif %}</p><div class="card-bottom"><b>{{'{:,}'.format(p.price).replace(',',' ')}} so‘m</b><button class="add" data-add="{{p.id}}" aria-label="Savatga qo‘shish">＋</button></div></div></article>
